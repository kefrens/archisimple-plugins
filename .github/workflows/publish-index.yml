# Builds every plugin here into an `.aspkg` and publishes them, with an
# `index.json`, as an ArchiSimple **remote repository** (ADR-0025).
#
# A user adds the published URL under Preferences → Repositories and installs
# from it. Nothing about the install path is special: ADR-0025's position is
# that "a Marketplace is simply another implementation of PackageRepository",
# and the pipeline that installs a bundled theme installs a downloaded one.
#
# ## Why this checks out the platform, and why that needs a token
#
# The builder is `@archisimple/package-builder`, reached through
# `@archisimple/cli` — both **private and unpublished**, so there is nothing to
# `npm install`. The alternative is a second implementation of the `.aspkg`
# format living here, which would drift from the real one and surface as a
# checksum mismatch on a user's machine. ArchiSimple's Finding I-82 is four
# sprints lost to exactly that mistake in a quieter place.
#
# `kefrens/archisimple` is **private**, and a workflow's automatic
# `GITHUB_TOKEN` is scoped to the repository running it — so checking the
# platform out needs a token of its own. Without one the checkout fails with
# `Not Found` while retrieving the default branch, which is what GitHub returns
# for a private repository the caller cannot see; it reads like a typo in the
# repository name and is not.
#
# **Required secret:** `PLATFORM_REPO_TOKEN` — a fine-grained personal access
# token with **read-only** `Contents` access to `kefrens/archisimple` and
# nothing else. Read-only is sufficient: this workflow only ever reads the
# platform, and writes solely to this repository's Pages.
#
# If `@archisimple/cli` is ever published, the checkout, the token and this
# paragraph all go away and the build step becomes `npx @archisimple/cli`.

name: Publish plugin index

on:
  push:
    branches: [main]
  workflow_dispatch:

# Pages needs these; nothing else in this workflow writes to the repository.
permissions:
  contents: read
  pages: write
  id-token: write

# One publish at a time. A second push mid-run would otherwise race to replace
# the same index, and the loser's archives would be advertised by the winner's
# checksums.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the plugins
        uses: actions/checkout@v5

      - name: Check the platform token is present
        # Without this, a missing secret reaches `actions/checkout` as an empty
        # token and fails with `Not Found - .../repos#get-a-repository` after
        # three retries — which reads as "that repository does not exist" rather
        # than "this workflow may not read it". Say the true thing first.
        run: |
          if [ -z "${{ secrets.PLATFORM_REPO_TOKEN }}" ]; then
            echo "::error::PLATFORM_REPO_TOKEN is not set. kefrens/archisimple is private, and a workflow's automatic GITHUB_TOKEN cannot read another repository. Create a fine-grained PAT with read-only Contents access to kefrens/archisimple and add it as this repository's PLATFORM_REPO_TOKEN secret."
            exit 1
          fi

      - name: Check out the platform, for its package builder
        uses: actions/checkout@v5
        with:
          repository: kefrens/archisimple
          path: .platform
          # The platform is private; the automatic token cannot read it.
          token: ${{ secrets.PLATFORM_REPO_TOKEN }}

      - uses: pnpm/action-setup@v4
        with:
          # Pinned, because this repository has no root `package.json` for the
          # action to read a `packageManager` field from — it is a folder of
          # plugins, not a workspace. Matches the platform's own declaration, so
          # `--frozen-lockfile` below is resolved by the pnpm that wrote the
          # lockfile.
          version: 10.13.1

      - uses: actions/setup-node@v5
        with:
          # The same Node as the services image and archisimple (24.22.1). The
          # companion services need Node >= 22.13 (pdfjs-dist 6's engines;
          # Sprint 002.5a DEC-1), which this satisfies.
          node-version: 24.22.1
          cache: pnpm
          cache-dependency-path: .platform/pnpm-lock.yaml

      # The companion services (Sprint 002.5a) are not packages and are not
      # published here, but they are tested here: cheap, and nothing else runs
      # them. Installed as the image installs them.
      - name: Install the services' dependencies, as the image does
        working-directory: services/fr-urban-rules-service
        run: npm ci --omit=dev --omit=optional --ignore-scripts

      - name: Audit the services' shipped dependencies
        working-directory: services/fr-urban-rules-service
        run: npm audit --omit=dev --audit-level=high

      - name: Test the services
        run: node --test 'services/*/tests/*.test.mjs'

      - name: Install the platform's dependencies
        working-directory: .platform
        run: pnpm install --frozen-lockfile

      - name: Build the CLI
        working-directory: .platform
        run: pnpm --filter @archisimple/cli build

      - name: Build every plugin, and the index
        run: node tools/build-index.mjs --cli .platform/tools/cli/dist/archisimple.js

      - name: Check the index against the platform's own parser
        # The reader the application will use, not a schema restated here. An
        # index this refuses is one a user's Preferences would refuse, and it is
        # cheaper to find out now.
        run: node tools/check-index.mjs --platform .platform

      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
